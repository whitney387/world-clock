<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="src/styles.css" />
    <title>world clock</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select name="country" id="country">
        <option value="">choose a city</option>
        <option value="current">Current Location</option>
        <option value="Europe/Paris">Paris</option>
        <option value="Australia/Sydney">Sydney</option>
        <option value="Asia/Tokyo">Tokyo</option>
        <option value="America/New_York">New York</option>
        <option value="Europe/Athens">Athens</option>
      </select>
      <div class="cities" id="cities">  
      <div class="city d-flex justify-content-between" id="london">
        <div>
          <h2 class="h-2" id="tokyo">Tokyo</h2>
          <div class="date"></div>
        </div>
        <div class="time p-2"> <small></small></div>
      </div>
      <div class="city d-flex justify-content-between" id="paris">
        <div>
          <h2 class="h-2">Paris</h2>
          <div class="date"></div>
        </div>
        <div class="time p-2"><small></small></div>
      </div>
    </div>
    </div>
    <footer>
      This project was coded by Whitney mmaitsi and is
      <a href="https://github.com/whitney387/world-clock" target="_blank"
        >open-sourced on github</a
      >
    </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone.min.js"></script>

<script src="https://momentjs.com/downloads/moment-timezone-with-data-10-year-range.js"></script>

<script src="src/index.js"></script>
</html>
